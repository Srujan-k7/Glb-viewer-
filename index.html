<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>GLB Viewer</title>
</head>
<body>
  <header class="site-head">
    <span class="brand-name">GLB Viewer</span>
    <button class="btn" id="reelBtn" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4.5v11l9-5.5-9-5.5Z" /></svg>
      Demo reel
    </button>
  </header>

  <main>
    <div class="intro">
      <h1>3D models</h1>
      <p class="muted" id="count"></p>
    </div>
    <p class="state" id="state" role="status">Loading models…</p>
    <ul class="grid" id="grid"></ul>
  </main>

  <dialog id="reel" aria-labelledby="reelTitle">
    <div class="reel-head">
      <h2 id="reelTitle">Demo reel</h2>
      <button class="icon-btn" id="reelClose" aria-label="Close reel">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" /></svg>
      </button>
    </div>
    <div class="reel-body">
      <video id="reelVideo" controls playsinline></video>
      <p class="reel-error" id="reelError" role="alert" hidden></p>
    </div>
  </dialog>

  <script type="module" src="/src/gallery.js"></script>
</body>
</html>
